stages:
    - build
    - scan
    - deploy

image: python:slim-buster

build_job:
    stage: build
    script:
        - pip install -r requirements.txt

safety_check:
    stage: scan
    before_script: 
        - pip install safety
        - pip install -r requirements.txt
    script:
        - iconv -f UTF-16LE -t UTF-8 requirements.txt -o requirements-utf8.txt || { echo "Conversion failed"; exit 1; }
        - python -m safety --key "$SAFETY_API_KEY" --stage cicd scan --file requirements-utf8.txt --output html > safety-report.html
        - ls -la safety-report.html
    artifacts:
        paths:
            - safety-report.html
        when: always
    allow_failure: true
    rules:
        - if: '$SKIP_SAFETY == "true"'
          when: never
        - when: on_success
    
deploy_stage:
    stage: deploy
    before_script: apt-get update -y && apt-get install -y curl
    script:
        - curl -X POST -d '{}' $DEPLOY_HOOK
    rules:
        - if: '$SKIP_DEPLOY == "true"'
          when: never
        - when: on_success