stages:
    - build
    - scan
    - deploy

image: python:slim-buster

build_job:
    stage: build
    script:
        - pip install -r requirements.txt

dependency-check:
    stage: scan
    image: owasp/dependency-check
    script:
        - /usr/share/dependency-check/bin/dependency-check.sh --project Test --out . --scan . --enableExperimental --failOnCVSS 7

safety_check:
    stage: scan
    before_script: 
        - pip install safety
        - pip install -r requirements.txt
    script:
    - python -c "import io; f = open('requirements.txt', 'rb').read().decode('utf-16'); open('requirements-utf8.txt', 'w', encoding='utf-8').write(f)" || { echo 'Conversion failed'; exit 1; }
    - python -m safety --key "$SAFETY_API_KEY" --stage cicd scan --file requirements-utf8.txt --output html > safety-report.html
    - ls -la safety-report.html
    artifacts:
        paths:
            - safety-report.html
        when: always
    allow_failure: true
    rules:
        - if: '$SKIP_SAFETY == "true"'
          when: always
        - when: on_success
    
deploy_stage:
    stage: deploy
    before_script: apt-get update -y && apt-get install -y curl
    script:
        - curl -X POST -d '{}' $DEPLOY_HOOK
    rules:
        - if: '$SKIP_DEPLOY == "true"'
          when: never
        - when: on_success