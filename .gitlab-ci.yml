stages:
    - build
    - scan
    - deploy

image: python:slim-buster

build_job:
    stage: build
    script:
        - pip install -r requirements.txt

dependency-check:
  stage: dependency-check
  image:
    name: owasp/dependency-check:latest
    entrypoint: [""]
  script:
    - /usr/share/dependency-check/bin/dependency-check.sh --project "Auto-Mailer" --scan . --format "HTML" --out dependency-check-report.html --nvdApiKey $NVD_API_KEY
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dependency-check-report.html

deploy_stage:
    stage: deploy
    before_script: apt-get update -y && apt-get install -y curl
    script:
        - curl -X POST -d '{}' $DEPLOY_HOOK
    rules:
        - if: '$SKIP_DEPLOY == "true"'
          when: never
        - when: on_success