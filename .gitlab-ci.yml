stages:
    - build
    - scan
    - deploy

image: python:slim-buster

build_job:
    stage: build
    script:
        - pip install -r requirements.txt

safety_check:
    stage: scan
    before_script: 
        - pip install safety
        - pip install -r requirements.txt
    script: 
        - safety --key $SAFETY_API_KEY --stage cicd scan
    artifacts:
        paths:
            - safety-report.html
        when: always
    

deploy_stage:
    stage: deploy
    script:
        - curl -X POST -d '{}' $DEPLOY_HOOK