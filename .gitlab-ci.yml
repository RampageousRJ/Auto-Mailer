stages:
    - build
    - test
    - deploy

image: python:slim-buster

build_job:
    stage: build
    script:
        - pip install -r requirements.txt

dependency_scan:
  stage: test
  image: python:slim-buster
  script:
    - pip install pip-audit
    - pip-audit -r requirements.txt --format json > pip-audit-report.json || true
  artifacts:
    paths:
      - pip-audit-report.json
  allow_failure: true

deploy_stage:
    stage: deploy
    before_script: apt-get update -y && apt-get install -y curl
    script:
        - curl -X POST -d '{}' $DEPLOY_HOOK
    rules:
        - if: '$SKIP_DEPLOY == "true"'
          when: never
        - when: on_success