stages:
    - build
    - scan
    - deploy

image: python:slim-buster

build_job:
    stage: build
    script:
        - pip install -r requirements.txt

dependency_scan:
  stage: scan
  image: dependencycheck/dependency-check:latest
  variables:
    REPORT_PATH: "reports"
  script:
    - dependency-check.sh --project "Auto-Mailer" --out . --scan . --failOnCVSS 7 --nvdApiKey "$NVD_API_KEY"
  artifacts:
    paths:
      - $REPORT_PATH/dependency-check-report.html
    when: always
  rules:
    - when: on_success

deploy_stage:
    stage: deploy
    before_script: apt-get update -y && apt-get install -y curl
    script:
        - curl -X POST -d '{}' $DEPLOY_HOOK
    rules:
        - if: '$SKIP_DEPLOY == "true"'
          when: never
        - when: on_success